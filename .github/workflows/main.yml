name: main

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch:            # run it manually from the Actions tab
  push:
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub + LeetCode data and redraw the dashboards
        env:
          # Optional: add a repo secret named STATS_TOKEN (a classic PAT with read:user)
          # if you want private contributions counted. Otherwise the built-in token is used.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          LEETCODE_USER: Rushi_28
        run: python3 scripts/update_stats.py

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh live stats"
            git pull --rebase
            git push
          fi
